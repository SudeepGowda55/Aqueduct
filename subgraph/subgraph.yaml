specVersion: 0.0.9
description: >-
  Aqueduct exposure subgraph: aggregates a maker's committed balances across every Aqua strategy
  they've shipped, so a keeper can compute a live cross-protocol exposure ratio and post it to
  ExposureOracle for the ExposureGate SwapVM opcode to read.
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Aqua
    # "base-sepolia" follows Graph Studio's usual "<chain>-sepolia" naming (confirmed for e.g.
    # "arbitrum-sepolia"), but wasn't independently confirmed for Base specifically -- double
    # check against Graph Studio's own network list at deploy time; it fails loudly and
    # immediately if wrong, so this is a safe field to leave as a strong guess.
    network: base-sepolia
    source:
      # Real Aqua deployment on Base Sepolia (see the project README's "Live on Base Sepolia"
      # section) -- deployed by script/AqueductDemo.s.sol, verified via a real swap through it
      # before this address was filled in here.
      address: "0x2e706D0c3a6d9C8d62Bb3276Ff9a1a04e9108461"
      abi: Aqua
      startBlock: 46640685 # Aqua's actual deployment block on Base Sepolia
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Strategy
        - StrategyBalance
        - AquaBalanceEvent
        - Maker
        - ExposurePosition
        - ExposureSnapshot
      abis:
        - name: Aqua
          file: ./abis/Aqua.json
        - name: ExposureOracle
          file: ./abis/ExposureOracle.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Shipped(address,address,bytes32,bytes)
          handler: handleShipped
        - event: Pushed(address,address,bytes32,address,uint256)
          handler: handlePushed
        - event: Pulled(address,address,bytes32,address,uint256)
          handler: handlePulled
        - event: Docked(address,address,bytes32)
          handler: handleDocked
      file: ./src/mapping.ts
  - kind: ethereum
    name: ExposureOracle
    network: base-sepolia
    source:
      # Live ExposureOracle (see frontend/public/deployment.json) -- same
      # startBlock as Aqua (oracle was redeployed after, so nothing is missed).
      address: "0xE68530d8e694eC6d237F0B07eC24C405c8Cd764A"
      abi: ExposureOracle
      startBlock: 46640685
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Maker
        - ExposurePosition
        - ExposureSnapshot
      abis:
        - name: ExposureOracle
          file: ./abis/ExposureOracle.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: ExposureUpdated(indexed address,uint64,uint256)
          handler: handleExposureUpdated
        - event: MakerPauseUpdated(indexed address,bool)
          handler: handleMakerPauseUpdated
      file: ./src/mapping.ts
  - kind: ethereum
    name: PoolManager
    network: base-sepolia
    source:
      # Uniswap v4 PoolManager on Base Sepolia. Only two pools matter (see
      # POOL_TO_STRATEGY in mapping.ts); the handler ignores everything else.
      address: "0x05E73354cFDd6745C338b50BcFDfA3Aa6fA03408"
      abi: PoolManager
      startBlock: 46640685
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - ExposurePosition
        - Token
        - LiquidityPool
        - Swap
      abis:
        - name: PoolManager
          file: ./abis/PoolManager.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Swap(indexed bytes32,indexed address,int128,int128,uint160,uint128,int24,uint24)
          handler: handlePoolSwap
      file: ./src/mapping.ts
  - kind: ethereum
    name: AquaRouter
    network: base-sepolia
    source:
      # Original ExposureAwareAquaRouter (script/AqueductDemo.s.sol) — same
      # Swapped event as V2, so old-pool swaps get real amounts too.
      address: "0xc008dd3d1293543d5fa7ad6eed285ed45e3d7ccc"
      abi: ExposureAwareAquaRouter
      startBlock: 46640687 # router's actual deployment block on Base Sepolia
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - SwapAmounts
      abis:
        - name: ExposureAwareAquaRouter
          file: ./abis/ExposureAwareAquaRouter.json
      eventHandlers:
        - event: Swapped(bytes32,address,address,address,address,uint256,uint256)
          handler: handleSwapped
      file: ./src/mapping.ts
  - kind: ethereum
    name: AquaRouterV2
    network: base-sepolia
    source:
      # Fixed router (script/AqueductV2Redeploy.s.sol) — maker-pause check
      # compiled in; backs the new Strategy A pools.
      address: "0x00449DD6DCD06327d0ae98f013CfFb7426658B21"
      abi: ExposureAwareAquaRouter
      startBlock: 46720304 # router's actual deployment block on Base Sepolia
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - SwapAmounts
      abis:
        - name: ExposureAwareAquaRouter
          file: ./abis/ExposureAwareAquaRouter.json
      eventHandlers:
        - event: Swapped(bytes32,address,address,address,address,uint256,uint256)
          handler: handleSwapped
      file: ./src/mapping.ts
