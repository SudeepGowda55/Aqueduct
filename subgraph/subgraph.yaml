specVersion: 0.0.9
description: >-
  Aqueduct exposure subgraph: aggregates a maker's committed balances across every Aqua strategy
  they've shipped, so a keeper can compute a live cross-protocol exposure ratio and post it to
  ExposureOracle for the ExposureGate SwapVM opcode to read.
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Aqua
    # "base-sepolia" follows Graph Studio's usual "<chain>-sepolia" naming (confirmed for e.g.
    # "arbitrum-sepolia"), but wasn't independently confirmed for Base specifically -- double
    # check against Graph Studio's own network list at deploy time; it fails loudly and
    # immediately if wrong, so this is a safe field to leave as a strong guess.
    network: base-sepolia
    source:
      # Real Aqua deployment on Base Sepolia (see the project README's "Live on Base Sepolia"
      # section) -- deployed by script/AqueductDemo.s.sol, verified via a real swap through it
      # before this address was filled in here.
      address: "0x2e706D0c3a6d9C8d62Bb3276Ff9a1a04e9108461"
      abi: Aqua
      startBlock: 46640685 # Aqua's actual deployment block on Base Sepolia
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Strategy
        - StrategyBalance
        - AquaBalanceEvent
      abis:
        - name: Aqua
          file: ./abis/Aqua.json
      eventHandlers:
        - event: Shipped(address,address,bytes32,bytes)
          handler: handleShipped
        - event: Pushed(address,address,bytes32,address,uint256)
          handler: handlePushed
        - event: Pulled(address,address,bytes32,address,uint256)
          handler: handlePulled
        - event: Docked(address,address,bytes32)
          handler: handleDocked
      file: ./src/mapping.ts
